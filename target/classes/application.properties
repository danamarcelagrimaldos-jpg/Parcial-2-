spring.application.name=proyecto-bavaria

# Base de datos H2 por defecto para ejecución inmediata sin configuración externa
spring.datasource.url=jdbc:h2:mem:bavariadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración PostgreSQL para Producción (Descomentar en servidor/Docker)
# spring.datasource.url=jdbc:postgresql://localhost:5432/bavaria_db
# spring.datasource.username=bavaria_user
# spring.datasource.password=bavaria_pass
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
